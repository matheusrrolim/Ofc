name: Mesa de Jogos - APK Android

on:
  push:
    paths:
      - 'jogos/**'
      - '.github/workflows/jogos-android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jogos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Testes das regras
        run: npm test

      - name: Gerar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: jogos/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mesa-de-jogos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-de-jogos-apk
          path: jogos/mesa-de-jogos.apk
          retention-days: 30
