name: Mesa de Jogos - APK Android

on:
  push:
    paths:
      - 'jogos/**'
      - '.github/workflows/jogos-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jogos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Testes das regras
        run: npm test

      # Endereço do servidor online dentro do APK (variável MESA_SERVER_URL do repositório).
      - name: Configurar servidor online
        if: ${{ vars.MESA_SERVER_URL != '' }}
        run: echo "window.MESA_SERVER = '${{ vars.MESA_SERVER_URL }}';" > www/js/config.js

      - name: Gerar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      # Chave de debug fixa: assim cada APK novo instala por cima do anterior
      # sem precisar desinstalar. (Para a Play Store será usada outra chave.)
      - name: Usar chave de debug fixa
        run: |
          mkdir -p ~/.android
          cp build/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: jogos/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mesa-de-jogos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-de-jogos-apk
          path: jogos/mesa-de-jogos.apk
          retention-days: 30

      # Publica o APK num link fixo, que baixa sem login:
      # https://github.com/<dono>/<repo>/releases/download/apk/mesa-de-jogos.apk
      - name: Publicar link de download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk mesa-de-jogos.apk \
            --target "$GITHUB_SHA" \
            --title "Mesa de Jogos (Android)" \
            --notes "APK de teste gerado em $(date -u '+%d/%m/%Y %H:%M') UTC a partir de ${GITHUB_SHA::7}. Baixe o mesa-de-jogos.apk abaixo e instale no celular." \
            --prerelease
